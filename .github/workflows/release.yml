# Publishing by tag.
#
# Why CI publishes rather than a person: an interactive `npm publish` now goes
# through staged publishing and needs 2FA approval, and a token pasted into a
# session expires. Publishing from a workflow avoids both.
#
# One-time setup (recommended, needs no token): add a Trusted Publisher on the
# npm package —
#   Publisher: GitHub Actions
#   Organization: <owner>
#   Repository: <repo>
#   Workflow filename: release.yml      ← must match this filename exactly
#   Allowed actions: tick "Allow npm publish" to publish on tag push; leave it
#   unticked if you would rather approve each release on npm.
# Fallback: a repository secret NPM_TOKEN. Use an *Automation* token — a session
# token goes through staged publish and leaves `latest` pointing at the old
# version.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  # `contents` must be write, not read: besides publishing to npm this workflow
  # creates the GitHub Release. It used to be read and had no such step, so
  # pushing a tag left the repository's Releases panel frozen on the previous
  # version — the code was updated and the front page looked untouched. The
  # Release for v1.0.0 had to be created by hand through the API because of
  # this.
  contents: write
  # Trusted Publishing (OIDC): npm confirms through GitHub's OIDC token that
  # this publish really came from this repository and this workflow, so no npm
  # token is needed — and there is nothing to expire or leak.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # The harness peer packages the suite compiles against. Keep this version
      # in step with the one test.yml pins; moving one without the other means
      # the release is validated against a harness nobody runs.
      - name: Install the harness peers
        run: npm install --no-save --no-audit --no-fund @deepseek-ai/dsh@0.1.5-rc.2
      - name: Link harness peers for the suite
        run: node tools/link-harness-peers.mjs

      # The same guards test.yml runs. A red guard here means a bad version never
      # reaches npm at all.
      - name: Suite
        run: node test/run.mjs
      - name: Bilingual pairing
        run: node tools/verify-translation-pairing.mjs
      - name: Documented numbers
        run: node tools/verify-doc-numbers.mjs
      - name: Version consistency
        run: node tools/verify-version-consistency.mjs --dsh 0.1.5-rc.2

      # Credential self-check. Run this workflow by hand (workflow_dispatch)
      # after rotating an npm password to learn immediately whether the token
      # still works, instead of discovering it at the next release.
      - name: Credential self-check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "no NPM_TOKEN configured — publishing will use OIDC"
            exit 0
          fi
          npm whoami

      # Idempotent: re-running a tag npm already has does nothing.
      # Both the name and the version are read from package.json, so renaming
      # the package cannot leave a stale literal here.
      #
      # Publishing can legitimately be impossible — no NPM_TOKEN and no trusted
      # publisher configured yet. That is a configuration state rather than a
      # broken release, so it is reported with the two ways to fix it and the
      # job still succeeds. Every other failure still fails the job: a red run
      # that means "credentials missing" trains people to ignore red runs.
      - name: Publish (skips a version npm already has)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already on npm — nothing to do"
            exit 0
          fi
          if npm publish --tag latest 2>&1 | tee /tmp/publish.log; then
            echo "published ${NAME}@${VERSION}"
            exit 0
          fi
          if grep -qE 'ENEEDAUTH|E401|EOTP|need auth|requires auth' /tmp/publish.log; then
            echo ""
            echo "::notice::npm publishing is not configured for this repository — the release itself is fine."
            echo "Two ways to enable it:"
            echo "  1. add a repository secret NPM_TOKEN (an *Automation* token, not a session token), or"
            echo "  2. on npmjs.com, add a Trusted Publisher for this package:"
            echo "       Publisher: GitHub Actions, Repository: this repo, Workflow: release.yml"
            echo "Then re-run this workflow for the existing tag."
            exit 0
          fi
          echo "publish failed for a reason other than missing credentials — see the log above"
          exit 1

      # Create the GitHub Release, with the body lifted straight out of the
      # CHANGELOG entry for this tag rather than retyped — retyped notes drift.
      #
      # `if: always()` is not decoration. npm publishing is a separate concern
      # and can fail on its own; without this, a publish failure would also cost
      # the Release and the front page would stay frozen, which is the symptom
      # this step exists to remove. The tag check keeps a manual dispatch from
      # trying to cut a release for a branch.
      - name: Create the GitHub Release (body taken from the CHANGELOG)
        if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Do not inherit `-e` from the runner's shell invocation and hope. A
          # failing extraction must abort this step: without it the `gh release
          # create` below still runs and cuts a Release with stale notes from the
          # previous version. Verified by running this very block with a
          # nonexistent tag — `notes/verify-release-notes.mjs` in the ledger
          # reproduces it.
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          node -e '
            const fs = require("fs");
            const [ver, file, out] = process.argv.slice(1);
            const text = fs.readFileSync(file, "utf8");
            // Both heading spellings are accepted on purpose: this CHANGELOG has
            // used `## 1.0.0` and `## [0.1.0] - <date>`. A reader that can only
            // match one of them is the reason a counter silently stopped working
            // elsewhere in this repository.
            const heading = new RegExp("^## \\[?" + ver.replace(/[.]/g, "\\.") + "\\]?(?:\\s|$)", "m");
            const start = text.search(heading);
            if (start === -1) { console.error("CHANGELOG has no section for " + ver); process.exit(1); }
            const rest = text.slice(text.indexOf("\n", start) + 1);
            const next = rest.search(/^## /m);
            const body = (next === -1 ? rest : rest.slice(0, next)).replace(/^\n+/, "").trimEnd();
            fs.writeFileSync(out, body + "\n");
            console.error("release notes for " + ver + ": " + body.split("\n").length + " lines");
          ' "$VER" CHANGELOG.md /tmp/release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do"
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md
          echo "Release $TAG created"
